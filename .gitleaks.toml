# Configuración de gitleaks (GitHub Action .github/workflows/secretos.yml).
# Reglas por defecto de gitleaks + excepciones mínimas. Guía: docs/SEGURIDAD-REPO.md
title = "erp-wm"

[extend]
useDefault = true

[allowlist]
description = "Tests del revisor de secretos: contienen claves inventadas a propósito"
# Lista cerrada de archivos exactos: un archivo nuevo se escanea aunque se llame *.test.ts.
paths = [
  '''^scripts/seguridad/reglas\.test\.ts$''',
  '''^scripts/seguridad/revisar-commit\.test\.ts$''',
]

# Segunda barrera contra secretos en el repo (la primera es .githooks/pre-commit, que se puede
# saltar con --no-verify). Si encuentra algo, el check falla y GitHub avisa por correo.
# Guía: docs/SEGURIDAD-REPO.md
name: Secretos

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  gitleaks:
    runs-on: ubuntu-latest
    steps:
      # Versiones fijadas por commit: nadie puede cambiar el código de la acción por debajo.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - uses: gitleaks/gitleaks-action@e0c47f4f8be36e29cdc102c57e68cb5cbf0e8d1e # v3.0.0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITLEAKS_ENABLE_COMMENTS: false
          # El repo es público: no publicar el archivo de resultados (ya va con --redact, pero
          # así no queda descargable). Los hallazgos se ven en el log y el resumen del job.
          GITLEAKS_ENABLE_UPLOAD_ARTIFACT: false
